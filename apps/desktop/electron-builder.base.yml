# What both electron-builder profiles share; never used on its own. The leaf configurations,
# electron-builder.test.yml and electron-builder.release.yml, extend it and each declare in full
# what differs per build profile: the bundles they pack (`files`, `.vite/<profile>` only), the
# entry (`extraMetadata.main`) and the output directory (`out/<profile>`), so neither depends on
# how `extends` merges arrays or can pick up the other profile's bundles or packages.
# electron-builder packages what the Vite builds emitted plus the web client build. Build-time
# packages live in devDependencies and are already bundled, so no node_modules ship; `dependencies`
# is reserved for native modules that must stay external (none yet).
# Placeholders to replace per project: appId, productName, and in package.json `homepage` and
# `author` (deb needs both; the author's email is the package maintainer).
appId: dev.repo.desktop
productName: Desktop
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false
extraResources:
  - from: ../web/build/client
    to: client
mac:
  target:
    - dmg
    - zip
  # Unsigned for now: signing identity and notarization come with certificates.
  identity: null
win:
  target:
    - nsis
# An assisted installer: it shows its pages and lets the user choose the installation directory and
# whether to install for this user or for all users (the latter asks for elevation).
nsis:
  include: nsis/installer.nsh
  artifactName: "${productName} Setup ${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - deb
    - rpm
