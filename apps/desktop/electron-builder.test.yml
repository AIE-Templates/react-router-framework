# The test profile: `pnpm package:desktop:test` (`pnpm --dir apps/desktop package:test`) builds it unpacked into
# out/test from the `.vite/test` bundles, for Playwright (e2e/desktop.ts), the smoke and the
# benchmark. Its fuses are flipped after packing (scripts/fuses.ts): the release package's set except
# the Node CLI inspect arguments, which Playwright's Electron driver needs. Its cookie encryption is
# on, so the launchers keep it off the system keychain (scripts/launch.ts). Installers are built only
# from the release profile.
extends: ./electron-builder.base.yml
extraMetadata:
  main: .vite/test/main.cjs
files:
  - ".vite/test/main.cjs"
  - ".vite/test/preload.cjs"
  - ".vite/test/utility.mjs"
  - package.json
directories:
  output: out/test
afterPack: ./scripts/fuses.ts
mac:
  extraResources:
    - from: .vite/test/window-appearance.node
      to: window-appearance.node
