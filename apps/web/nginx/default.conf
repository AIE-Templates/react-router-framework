server {
  listen 8080;
  root /usr/share/nginx/html;

  # Built assets have content hashes in their names.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every other path falls back to the SPA shell, which revalidates on every load so it never points
  # at assets from an old deploy. React Router reports unknown paths as 404 once it hydrates.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.html;
  }
}
